[package]
name = "fierium-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fierium: erros com código, log em arquivo, leitura aos pedaços e o domínio (sem Tauri, sem tela)"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"

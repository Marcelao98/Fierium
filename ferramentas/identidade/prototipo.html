<!doctype html>
<!-- Protótipo estático do M1.5 (docs/IDENTIDADE.md): três direções visuais pra o Marcelo escolher.
     Não faz parte do app. Uso: prototipo.html?d=nebulosa|ceu|aurora&t=inicio|biblioteca|leitor
     Os prints saem de ferramentas/identidade/prints.mjs. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Fierium · direções</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@300..650&family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1440px;
        height: 900px;
        overflow: hidden;
      }
      body {
        font-family: var(--f-ui);
        color: var(--tx);
        background: var(--bg);
        position: relative;
        -webkit-font-smoothing: antialiased;
      }
      #ceu {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      #app {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: 76px 1fr;
      }
      svg {
        display: block;
      }

      /* ---------- direções ---------- */
      .nebulosa {
        --bg: #08071a;
        --tx: #ece8f6;
        --tx2: #b5afcb;
        --tx3: #7f789d;
        --luz: #f4dca4;
        --acento: #b7a6ff;
        --aurora: #7fd6c0;
        --veu: rgba(30, 24, 70, 0.42);
        --borda: rgba(200, 185, 255, 0.16);
        --brilho-borda: rgba(190, 170, 255, 0.38);
        --f-tit: 'Fraunces', serif;
        --f-ui: 'Inter', sans-serif;
        --f-ler: 'Literata', serif;
        --raio: 18px;
      }
      .ceu {
        --bg: #0a0f1e;
        --tx: #efe4c8;
        --tx2: #c2b48f;
        --tx3: #8a7f63;
        --luz: #e2b866;
        --acento: #e2b866;
        --aurora: #8fb3c9;
        --veu: rgba(10, 16, 32, 0.78);
        --borda: rgba(226, 184, 102, 0.3);
        --brilho-borda: rgba(226, 184, 102, 0.55);
        --f-tit: 'Cormorant Garamond', serif;
        --f-cap: 'Cinzel', serif;
        --f-ui: 'Inter', sans-serif;
        --f-ler: 'Cormorant Garamond', serif;
        --raio: 3px;
      }
      .aurora {
        --bg: #040b10;
        --tx: #eaf6f2;
        --tx2: #a9c4bd;
        --tx3: #6c8a84;
        --luz: #f6e7b0;
        --acento: #6ff0c4;
        --aurora: #6ff0c4;
        --rosa: #ff8fc8;
        --veu: rgba(8, 22, 28, 0.55);
        --borda: rgba(140, 255, 215, 0.14);
        --brilho-borda: rgba(111, 240, 196, 0.45);
        --f-tit: 'Cormorant Garamond', serif;
        --f-ui: 'Inter', sans-serif;
        --f-ler: 'Literata', serif;
        --raio: 22px;
      }

      /* ---------- casca ---------- */
      .lateral {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 18px 0;
        border-right: 1px solid var(--borda);
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.05));
      }
      .lateral .selo {
        width: 44px;
        height: 44px;
        margin-bottom: 14px;
      }
      .lateral a {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: var(--tx3);
      }
      .lateral a.on {
        color: var(--luz);
        background: rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 0 0 1px var(--borda);
      }
      .ceu .lateral a.on {
        border-radius: 2px;
        background: none;
        box-shadow: inset 0 0 0 1px var(--borda);
      }
      .lateral .fim {
        margin-top: auto;
      }
      .ic {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      main {
        position: relative;
        overflow: hidden;
      }
      .topo {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 22px 40px 0;
      }
      .busca {
        flex: 0 0 420px;
        height: 40px;
        border-radius: 999px;
        border: 1px solid var(--borda);
        background: var(--veu);
        backdrop-filter: blur(14px);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        color: var(--tx3);
        font-size: 13.5px;
      }
      .ceu .busca {
        border-radius: 2px;
      }
      .busca kbd {
        margin-left: auto;
        font: 11px var(--f-ui);
        border: 1px solid var(--borda);
        border-radius: 5px;
        padding: 1px 6px;
      }
      .topo .esp {
        flex: 1;
      }
      .migalha {
        font-size: 13px;
        color: var(--tx3);
        letter-spacing: 0.02em;
      }
      .ceu .migalha {
        font-family: var(--f-cap);
        letter-spacing: 0.14em;
        font-size: 11.5px;
        text-transform: uppercase;
      }

      /* ---------- capas ---------- */
      .capa {
        position: relative;
        aspect-ratio: 2/3;
        border-radius: 6px;
        overflow: hidden;
        background: var(--c1);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
      }
      .capa .arte {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 80% at 30% 15%, var(--c2), transparent 60%),
          radial-gradient(90% 70% at 80% 90%, var(--c3), transparent 70%), var(--c1);
      }
      .capa .t {
        position: absolute;
        left: 10%;
        right: 10%;
        top: 12%;
        font-family: 'Fraunces', serif;
        font-weight: 500;
        color: rgba(255, 250, 235, 0.95);
        font-size: var(--tam, 15px);
        line-height: 1.1;
      }
      .capa .a {
        position: absolute;
        left: 10%;
        bottom: 9%;
        font:
          500 calc(var(--tam, 15px) * 0.58) 'Inter',
          sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 250, 235, 0.7);
      }
      .capa .fio {
        position: absolute;
        left: 10%;
        right: 10%;
        top: 56%;
        height: 1px;
        background: rgba(255, 250, 235, 0.35);
      }
      .capa::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, rgba(255, 255, 255, 0.18), transparent 35%);
      }
      /* nebulosa: a capa flutua com halo da própria cor */
      .nebulosa .obra .capa {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08),
          0 18px 40px rgba(0, 0, 0, 0.55),
          0 0 46px -6px var(--halo);
      }
      .nebulosa .obra.foco .capa {
        transform: translateY(-8px);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.2),
          0 26px 50px rgba(0, 0, 0, 0.55),
          0 0 70px 4px var(--halo);
      }
      /* céu antigo: moldura gravada */
      .ceu .obra .capa {
        border-radius: 1px;
        box-shadow:
          0 0 0 1px rgba(226, 184, 102, 0.55),
          0 0 0 5px var(--bg),
          0 0 0 6px rgba(226, 184, 102, 0.25),
          0 16px 30px rgba(0, 0, 0, 0.6);
      }
      .ceu .obra.foco .capa {
        box-shadow:
          0 0 0 1px var(--luz),
          0 0 0 5px var(--bg),
          0 0 0 6px var(--luz),
          0 0 40px rgba(226, 184, 102, 0.35);
      }
      /* aurora: vidro e reflexo no chão */
      .aurora .obra .capa {
        border-radius: 10px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.12),
          0 20px 40px rgba(0, 0, 0, 0.6);
      }
      .aurora .obra .capa + .reflexo {
        display: block;
      }
      .aurora .obra.foco .capa {
        transform: translateY(-6px);
        box-shadow:
          0 0 0 1px rgba(111, 240, 196, 0.6),
          0 24px 50px rgba(0, 0, 0, 0.6),
          0 0 50px -4px rgba(111, 240, 196, 0.5);
      }
      .reflexo {
        display: none;
        height: 26px;
        margin-top: 6px;
        border-radius: 10px;
        background: linear-gradient(180deg, var(--halo), transparent);
        opacity: 0.22;
        filter: blur(6px);
      }

      .obra .nome {
        margin-top: 12px;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--tx);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .obra .autor {
        font-size: 12px;
        color: var(--tx3);
        margin-top: 2px;
      }
      .ceu .obra .nome {
        font-family: var(--f-tit);
        font-size: 17px;
        font-weight: 600;
      }
      .ceu .obra .autor {
        font-family: var(--f-tit);
        font-style: italic;
        font-size: 14px;
      }
      .aurora .obra .nome {
        font-family: var(--f-tit);
        font-size: 17px;
        font-weight: 600;
      }
      .prog {
        height: 2px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        margin-top: 8px;
        overflow: hidden;
      }
      .prog i {
        display: block;
        height: 100%;
        background: var(--luz);
        box-shadow: 0 0 8px var(--luz);
      }
      .aurora .prog i {
        background: linear-gradient(90deg, var(--aurora), var(--rosa));
        box-shadow: 0 0 8px var(--aurora);
      }

      /* ---------- Início ---------- */
      .limiar {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        padding: 0 90px 0 110px;
      }
      .limiar .fala .selo-g {
        width: 120px;
        height: 120px;
        margin-bottom: 26px;
      }
      .limiar h1 {
        font-family: var(--f-tit);
        font-weight: 400;
        font-size: 58px;
        line-height: 1.04;
        letter-spacing: -0.01em;
      }
      .nebulosa .limiar h1 {
        font-weight: 350;
      }
      .limiar h1 em {
        font-style: italic;
        color: var(--luz);
      }
      .ceu .limiar h1 {
        font-size: 62px;
        font-weight: 500;
      }
      .aurora .limiar h1 {
        font-size: 64px;
        font-weight: 500;
      }
      .aurora .limiar h1 em {
        background: linear-gradient(90deg, var(--aurora), #b9f7ff 50%, var(--rosa));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .limiar .sub {
        margin-top: 18px;
        color: var(--tx2);
        font-size: 16px;
        line-height: 1.6;
        max-width: 440px;
      }
      .ceu .limiar .sub {
        font-family: var(--f-tit);
        font-size: 20px;
        font-style: italic;
      }
      .limiar .cap {
        font-size: 11.5px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--tx3);
        margin-bottom: 14px;
      }
      .ceu .limiar .cap {
        font-family: var(--f-cap);
        color: var(--luz);
        letter-spacing: 0.3em;
      }
      .estrela-forte {
        justify-self: center;
        position: relative;
        width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .estrela-forte .aureola {
        position: absolute;
        top: -70px;
        left: 50%;
        width: 560px;
        height: 560px;
        transform: translateX(-50%);
        pointer-events: none;
      }
      .estrela-forte .capa {
        width: 230px;
        --tam: 24px;
        z-index: 1;
      }
      .nebulosa .estrela-forte .capa {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.15),
          0 30px 60px rgba(0, 0, 0, 0.6),
          0 0 90px 10px var(--halo);
      }
      .ceu .estrela-forte .capa {
        border-radius: 1px;
        box-shadow:
          0 0 0 1px var(--luz),
          0 0 0 7px var(--bg),
          0 0 0 8px rgba(226, 184, 102, 0.5),
          0 30px 60px rgba(0, 0, 0, 0.6);
      }
      .aurora .estrela-forte .capa {
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(111, 240, 196, 0.5),
          0 30px 60px rgba(0, 0, 0, 0.6),
          0 0 80px rgba(111, 240, 196, 0.35);
      }
      .estrela-forte .info {
        z-index: 1;
        text-align: center;
        margin-top: 26px;
      }
      .estrela-forte .info b {
        display: block;
        font-family: var(--f-tit);
        font-weight: 500;
        font-size: 26px;
      }
      .ceu .estrela-forte .info b {
        font-size: 30px;
        font-weight: 600;
      }
      .aurora .estrela-forte .info b {
        font-size: 30px;
        font-weight: 600;
      }
      .estrela-forte .info span {
        color: var(--tx3);
        font-size: 13.5px;
      }
      .ceu .estrela-forte .info span {
        font-family: var(--f-tit);
        font-style: italic;
        font-size: 17px;
      }
      .estrela-forte .prog {
        width: 230px;
        margin: 14px auto 0;
      }
      .botao {
        margin-top: 22px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 46px;
        padding: 0 24px;
        border-radius: 999px;
        font: 500 14.5px var(--f-ui);
        color: #14102a;
        background: var(--luz);
        box-shadow: 0 0 30px rgba(244, 220, 164, 0.35);
      }
      .ceu .botao {
        border-radius: 2px;
        background: none;
        color: var(--luz);
        box-shadow: inset 0 0 0 1px var(--luz);
        font-family: var(--f-cap);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 12.5px;
      }
      .aurora .botao {
        color: #03140f;
        background: linear-gradient(90deg, var(--aurora), #9ff6ff);
        box-shadow: 0 0 30px rgba(111, 240, 196, 0.4);
      }
      .mundos-rodape {
        position: absolute;
        left: 110px;
        right: 90px;
        bottom: 34px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .mundos-rodape .rot {
        font-size: 11.5px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--tx3);
        margin-right: 8px;
      }
      .ceu .mundos-rodape .rot {
        font-family: var(--f-cap);
      }
      .mundo {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 36px;
        padding: 0 15px 0 11px;
        border-radius: 999px;
        font-size: 13px;
        color: var(--tx2);
        background: var(--veu);
        border: 1px solid var(--borda);
        backdrop-filter: blur(10px);
      }
      .mundo i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--m);
        box-shadow: 0 0 12px 2px var(--m);
      }
      .mundo small {
        color: var(--tx3);
        font-size: 11.5px;
      }
      .ceu .mundo {
        border-radius: 2px;
        font-family: var(--f-tit);
        font-size: 16px;
        font-weight: 500;
      }
      .ceu .mundo i {
        border-radius: 0;
        transform: rotate(45deg);
        width: 8px;
        height: 8px;
        box-shadow: none;
        background: none;
        border: 1px solid var(--m);
      }

      /* ---------- Biblioteca ---------- */
      .bib {
        padding: 30px 40px 0;
      }
      .bib h2 {
        font-family: var(--f-tit);
        font-weight: 400;
        font-size: 40px;
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .ceu .bib h2 {
        font-weight: 500;
        font-size: 44px;
      }
      .aurora .bib h2 {
        font-weight: 500;
        font-size: 44px;
      }
      .bib h2 small {
        font: 400 14px var(--f-ui);
        color: var(--tx3);
      }
      .bib .linha {
        display: flex;
        gap: 10px;
        margin: 18px 0 26px;
        align-items: center;
      }
      .chip {
        height: 34px;
        padding: 0 15px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--tx2);
        border: 1px solid var(--borda);
        background: var(--veu);
        backdrop-filter: blur(10px);
      }
      .chip i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--m);
        box-shadow: 0 0 10px var(--m);
      }
      .chip.on {
        color: var(--tx);
        border-color: var(--brilho-borda);
        box-shadow: 0 0 22px -6px var(--brilho-borda);
      }
      .ceu .chip {
        border-radius: 2px;
        font-family: var(--f-tit);
        font-size: 15.5px;
        font-weight: 500;
      }
      .ceu .chip i {
        border-radius: 0;
        transform: rotate(45deg);
        width: 7px;
        height: 7px;
        box-shadow: none;
        background: none;
        border: 1px solid var(--m);
      }
      .bib .linha .esp {
        flex: 1;
      }
      .grade {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 34px 30px;
      }
      .desc-mundo {
        display: flex;
        gap: 22px;
        align-items: center;
        margin-top: -6px;
        margin-bottom: 22px;
        color: var(--tx2);
        font-size: 14px;
      }
      .ceu .desc-mundo {
        font-family: var(--f-tit);
        font-style: italic;
        font-size: 18px;
      }

      /* ---------- Leitor ---------- */
      .leitor {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .leitor .barra {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 20px 40px;
        color: var(--tx3);
        font-size: 13px;
      }
      .leitor .barra b {
        color: var(--tx2);
        font-weight: 500;
      }
      .ceu .leitor .barra b {
        font-family: var(--f-tit);
        font-size: 17px;
        font-weight: 600;
      }
      .leitor .barra .esp {
        flex: 1;
      }
      .pagina {
        position: relative;
        width: 720px;
        flex: 1;
        margin-bottom: 58px;
        padding: 58px 76px;
        border-radius: var(--raio);
        background: var(--veu);
        border: 1px solid var(--borda);
        backdrop-filter: blur(20px);
        overflow: hidden;
      }
      .nebulosa .pagina {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.02),
          0 40px 90px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .ceu .pagina {
        background: linear-gradient(180deg, #f1e6c9, #e9dbb7);
        color: #2b2216;
        border: none;
        box-shadow:
          0 0 0 1px rgba(226, 184, 102, 0.6),
          0 0 0 8px #0a0f1e,
          0 0 0 9px rgba(226, 184, 102, 0.35),
          0 40px 80px rgba(0, 0, 0, 0.6);
      }
      .aurora .pagina {
        background: rgba(6, 18, 22, 0.62);
      }
      .pagina .cap-ler {
        font-size: 11.5px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: var(--tx3);
        text-align: center;
      }
      .ceu .pagina .cap-ler {
        font-family: var(--f-cap);
        color: #8a6a2e;
      }
      .pagina h3 {
        font-family: var(--f-tit);
        font-weight: 400;
        font-size: 34px;
        text-align: center;
        margin: 10px 0 30px;
      }
      .ceu .pagina h3 {
        font-weight: 600;
        font-size: 38px;
        color: #2b2216;
      }
      .aurora .pagina h3 {
        font-weight: 500;
        font-size: 38px;
      }
      .pagina p {
        font-family: var(--f-ler);
        font-size: 18.5px;
        line-height: 1.72;
        color: var(--tx);
        text-indent: 1.6em;
        margin-bottom: 0.35em;
        text-align: justify;
        hyphens: auto;
      }
      .nebulosa .pagina p,
      .aurora .pagina p {
        color: #e2ddef;
      }
      .aurora .pagina p {
        color: #dcebe7;
      }
      .ceu .pagina p {
        font-size: 21px;
        line-height: 1.6;
        color: #2b2216;
        font-weight: 500;
      }
      .pagina p:first-of-type {
        text-indent: 0;
      }
      .pagina p:first-of-type::first-letter {
        font-family: var(--f-tit);
        float: left;
        font-size: 3.6em;
        line-height: 0.85;
        padding: 6px 10px 0 0;
        color: var(--luz);
      }
      .ceu .pagina p:first-of-type::first-letter {
        color: #8a5a1e;
        font-weight: 600;
      }
      .pagina mark {
        background: none;
        color: inherit;
        box-shadow: inset 0 -0.55em 0 rgba(244, 220, 164, 0.22);
      }
      .ceu .pagina mark {
        box-shadow: inset 0 -0.5em 0 rgba(200, 140, 40, 0.25);
      }
      .aurora .pagina mark {
        box-shadow: inset 0 -0.55em 0 rgba(111, 240, 196, 0.2);
      }
      .orbita-prog {
        position: absolute;
        right: 46px;
        bottom: 40px;
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
        text-align: center;
      }
      .orbita-prog svg {
        position: absolute;
        inset: 0;
      }
      .orbita-prog span {
        font-size: 10.5px;
        color: var(--tx2);
        line-height: 1.25;
      }
      .orbita-prog span b {
        display: block;
        font-family: var(--f-tit);
        font-size: 20px;
        color: var(--tx);
        font-weight: 500;
      }
      .lado-notas {
        position: absolute;
        left: 42px;
        top: 120px;
        width: 250px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .nota {
        padding: 14px 16px;
        border-radius: 12px;
        background: var(--veu);
        border: 1px solid var(--borda);
        font-size: 13px;
        color: var(--tx2);
        line-height: 1.5;
        backdrop-filter: blur(12px);
      }
      .nota b {
        display: block;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--luz);
        margin-bottom: 6px;
        font-weight: 500;
      }
      .ceu .nota {
        border-radius: 2px;
        font-family: var(--f-tit);
        font-size: 16px;
      }
      .ceu .nota b {
        font-family: var(--f-cap);
        font-size: 10.5px;
      }
      .etiqueta {
        position: absolute;
        right: 20px;
        bottom: 12px;
        z-index: 9;
        font:
          600 11px 'Inter',
          sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--tx3);
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <script src="selos.js"></script>
    <canvas id="ceu" width="1440" height="900"></canvas>
    <div id="app"></div>
    <script>
      const q = new URLSearchParams(location.search);
      const D = q.get('d') || 'nebulosa',
        T = q.get('t') || 'inicio';
      document.body.className = D;

      // ---------- gerador determinístico (os prints saem iguais toda vez) ----------
      let s = 20261108;
      const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;

      // ---------- o céu de cada direção ----------
      const cv = document.getElementById('ceu'),
        g = cv.getContext('2d');
      function nevoa(x, y, raio, cor, a) {
        const gr = g.createRadialGradient(x, y, 0, x, y, raio);
        gr.addColorStop(0, `rgba(${cor},${a})`);
        gr.addColorStop(0.45, `rgba(${cor},${a * 0.45})`);
        gr.addColorStop(1, `rgba(${cor},0)`);
        g.fillStyle = gr;
        g.fillRect(0, 0, 1440, 900);
      }
      function estrelas(n, cor, maxR, brilhos) {
        for (let i = 0; i < n; i++) {
          const x = r() * 1440,
            y = r() * 900,
            rr = Math.pow(r(), 3) * maxR + 0.3,
            a = 0.25 + r() * 0.75;
          g.fillStyle = `rgba(${cor},${a})`;
          g.beginPath();
          g.arc(x, y, rr, 0, 7);
          g.fill();
          if (rr > maxR * 0.55 && brilhos) {
            g.strokeStyle = `rgba(${cor},${a * 0.5})`;
            g.lineWidth = 0.6;
            g.beginPath();
            g.moveTo(x - rr * 5, y);
            g.lineTo(x + rr * 5, y);
            g.moveTo(x, y - rr * 5);
            g.lineTo(x, y + rr * 5);
            g.stroke();
          }
        }
      }
      if (D === 'nebulosa') {
        g.fillStyle = '#08071a';
        g.fillRect(0, 0, 1440, 900);
        // camadas de névoa: violeta, índigo, aurora, rosa; a luz dourada atrás da obra
        for (let i = 0; i < 26; i++)
          nevoa(
            200 + r() * 1200,
            100 + r() * 700,
            120 + r() * 260,
            ['120,90,220', '70,60,180', '90,200,180', '200,110,170'][i % 4],
            0.07 + r() * 0.08,
          );
        nevoa(1080, 360, 420, '120,80,230', 0.22);
        nevoa(1180, 520, 300, '80,200,180', 0.12);
        nevoa(300, 760, 380, '160,70,170', 0.12);
        nevoa(1010, 330, 200, '244,220,164', 0.1);
        estrelas(520, '255,246,223', 1.8, true);
      } else if (D === 'ceu') {
        g.fillStyle = '#0a0f1e';
        g.fillRect(0, 0, 1440, 900);
        nevoa(720, 450, 900, '30,40,70', 0.5);
        nevoa(1050, 380, 420, '226,184,102', 0.045);
        // grade de mapa celeste: paralelos e meridianos gravados
        g.strokeStyle = 'rgba(226,184,102,.07)';
        g.lineWidth = 1;
        const cx = 1050,
          cy = 1250;
        for (let rr = 500; rr < 2000; rr += 120) {
          g.beginPath();
          g.arc(cx, cy, rr, 0, 7);
          g.stroke();
        }
        for (let ang = -1.9; ang < -1.2; ang += 0.09) {
          g.beginPath();
          g.moveTo(cx, cy);
          g.lineTo(cx + Math.cos(ang) * 2200, cy + Math.sin(ang) * 2200);
          g.stroke();
        }
        // eclíptica
        g.strokeStyle = 'rgba(226,184,102,.16)';
        g.setLineDash([2, 6]);
        g.beginPath();
        g.ellipse(720, 520, 900, 260, -0.12, 0, 7);
        g.stroke();
        g.setLineDash([]);
        estrelas(380, '239,228,200', 1.6, false);
        // constelações (cada mundo é uma constelação)
        const consts = [
          [
            [1180, 120],
            [1240, 170],
            [1310, 150],
            [1360, 210],
            [1300, 260],
          ],
          [
            [150, 640],
            [210, 600],
            [260, 650],
            [330, 620],
            [300, 700],
          ],
          [
            [560, 90],
            [610, 140],
            [690, 120],
            [720, 60],
          ],
        ];
        consts.forEach((c) => {
          g.strokeStyle = 'rgba(226,184,102,.28)';
          g.lineWidth = 0.8;
          g.beginPath();
          c.forEach((p, i) => (i ? g.lineTo(...p) : g.moveTo(...p)));
          g.stroke();
          c.forEach((p) => {
            g.fillStyle = '#efe4c8';
            g.beginPath();
            g.arc(p[0], p[1], 2.2, 0, 7);
            g.fill();
            g.strokeStyle = 'rgba(226,184,102,.4)';
            g.beginPath();
            g.arc(p[0], p[1], 5, 0, 7);
            g.stroke();
          });
        });
      } else {
        g.fillStyle = '#040b10';
        g.fillRect(0, 0, 1440, 900);
        // faixas de aurora: cortinas verticais ao longo de uma curva
        const fitas = [
          { y: 210, amp: 70, cor: [111, 240, 196], alt: 340, a: 0.34 },
          { y: 140, amp: 50, cor: [150, 120, 255], alt: 260, a: 0.2 },
          { y: 270, amp: 90, cor: [255, 143, 200], alt: 200, a: 0.13 },
        ];
        fitas.forEach((f, k) => {
          for (let x = -20; x < 1460; x += 2) {
            const yy = f.y + Math.sin(x / 210 + k) * f.amp + Math.sin(x / 67 + k * 3) * 14;
            const gr = g.createLinearGradient(0, yy - f.alt, 0, yy + 30);
            const [R, G, B] = f.cor,
              a = f.a * (0.55 + 0.45 * Math.sin(x / 33 + k) ** 2);
            gr.addColorStop(0, `rgba(${R},${G},${B},0)`);
            gr.addColorStop(0.8, `rgba(${R},${G},${B},${a})`);
            gr.addColorStop(1, `rgba(${R},${G},${B},0)`);
            g.fillStyle = gr;
            g.fillRect(x, yy - f.alt, 2, f.alt + 30);
          }
        });
        nevoa(720, 1100, 700, '20,90,80', 0.35);
        estrelas(300, '230,255,248', 1.5, false);
      }

      // ---------- dados de exemplo (obras em domínio público) ----------
      const obras = [
        ['Dom Casmurro', 'Machado de Assis', '#3a1d3f', '#b0506b', '#24123a', 62, '#d77a9a'],
        ['A Odisseia', 'Homero', '#0f2a44', '#3d8fb8', '#0b1a2e', 18, '#5fb4e0'],
        ['Meditações', 'Marco Aurélio', '#2b2416', '#a68a4c', '#1a150c', 100, '#e3c27a'],
        ['Frankenstein', 'Mary Shelley', '#14261f', '#3f8f71', '#0b1813', 41, '#62d1a6'],
        ['Alice no País das Maravilhas', 'Lewis Carroll', '#2c1a46', '#8d6ae0', '#1a0f2d', 0, '#a58cff'],
        ['O Banquete', 'Platão', '#3a2412', '#c4803e', '#22140a', 77, '#f0a35a'],
        ['Os Lusíadas', 'Luís de Camões', '#102037', '#4f74c9', '#0a1424', 9, '#7d9bff'],
        ['Iracema', 'José de Alencar', '#173024', '#79b26b', '#0d1c14', 0, '#9fe08e'],
        ['Drácula', 'Bram Stoker', '#2e0d16', '#9e2a3c', '#1a070c', 55, '#e05a70'],
        ['Moby Dick', 'Herman Melville', '#0d2830', '#2d8a96', '#08181d', 23, '#4fd2e0'],
        ['A Divina Comédia', 'Dante Alighieri', '#33190f', '#d1683a', '#1d0e08', 34, '#ff8a52'],
        ['Assim Falou Zaratustra', 'Nietzsche', '#1f1a3c', '#c9a64a', '#120f24', 0, '#e8c86a'],
        ['O Cortiço', 'Aluísio Azevedo', '#2b2a14', '#9a9a3e', '#18170a', 88, '#d4d45e'],
        ['Memórias Póstumas', 'Machado de Assis', '#1c1630', '#6a5ab0', '#100c1d', 12, '#9c8cff'],
      ];
      const capa = (o, tam) =>
        `<div class="capa" style="--c1:${o[2]};--c2:${o[3]};--c3:${o[4]};--tam:${tam || 14}px"><div class="arte"></div><div class="t">${o[0]}</div><div class="fio"></div><div class="a">${o[1]}</div></div>`;
      const mundos = [
        ['Romance', '#d77a9a', 84],
        ['Filosofia', '#e3c27a', 37],
        ['Fantasia', '#a58cff', 52],
        ['Clássicos', '#5fb4e0', 61],
        ['Mangá', '#62d1a6', 128],
        ['Poesia', '#ff8a52', 23],
      ];

      // ---------- selo (cada direção usa o seu) ----------
      const SELOS = { nebulosa: (id) => seloA(id), ceu: (id) => seloB(id), aurora: (id) => seloC(id) };
      const selo = (id) => SELOS[D](id);
      const ic = {
        inicio: '<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',
        bib: '<path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.5 1-3 14-3.5-1z"/>',
        mapa: '<circle cx="6" cy="7" r="1.6"/><circle cx="17" cy="5" r="1.6"/><circle cx="12" cy="13" r="1.6"/><circle cx="19" cy="17" r="1.6"/><circle cx="5" cy="18" r="1.6"/><path d="M7.5 7.6l3.3 4.2M13.4 12.2l2.6-5.6M13.3 13.9l4.4 2.4M10.6 13.8l-4.2 3.4"/>',
        notas: '<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h5"/>',
        est: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
        conf: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
        busca: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
        voltar: '<path d="M15 5l-7 7 7 7"/>',
        aa: '<path d="M3 19l5-14 5 14M5 14h6M15 19l3.5-9 3.5 9M16 16h5"/>',
        marca: '<path d="M6 3h12v18l-6-4-6 4z"/>',
        livro: '<path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v14"/>',
      };
      const I = (n) => `<svg class="ic" viewBox="0 0 24 24">${ic[n]}</svg>`;
      const lateral = (on) =>
        `<nav class="lateral"><div class="selo">${selo('l')}</div>${['inicio', 'bib', 'mapa', 'notas', 'est'].map((n) => `<a class="${n === on ? 'on' : ''}">${I(n)}</a>`).join('')}<a class="fim">${I('conf')}</a></nav>`;
      const busca = `<div class="busca">${I('busca')} Buscar no seu céu…<kbd>Ctrl K</kbd></div>`;
      const nomes = { nebulosa: 'A · Nebulosa', ceu: 'B · Céu antigo', aurora: 'C · Aurora' };
      const frase = {
        nebulosa: [
          'O Limiar do Sonho',
          'Tudo que já foi <em>imaginado</em><br>mora em algum lugar daqui.',
          'A sua biblioteca é a sua parte do céu de Fieri. Continue de onde parou, ou se perca num mundo novo.',
        ],
        ceu: [
          'O Limiar do Sonho',
          'Tudo que já foi <em>imaginado</em><br>está no mapa de Fieri.',
          'Cada obra é uma estrela; cada série, uma constelação. Este é o seu pedaço do céu.',
        ],
        aurora: [
          'O Limiar do Sonho',
          'Onde o sonho<br><em>vira mundo.</em>',
          'Tudo que já foi imaginado, num céu que cresce com você. Volte pra estrela que mais brilha.',
        ],
      }[D];

      // aura da obra em destaque (cada direção do seu jeito)
      const aureola = {
        nebulosa: `<svg class="aureola" viewBox="0 0 560 560"><defs><radialGradient id="au"><stop offset="0" stop-color="#d77a9a" stop-opacity=".45"/><stop offset=".5" stop-color="#8a5ad0" stop-opacity=".15"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs><circle cx="280" cy="250" r="280" fill="url(#au)"/><ellipse cx="280" cy="250" rx="250" ry="70" fill="none" stroke="#f4dca4" stroke-opacity=".22" transform="rotate(-18 280 250)"/><ellipse cx="280" cy="250" rx="200" ry="200" fill="none" stroke="#b7a6ff" stroke-opacity=".12" stroke-dasharray="2 8"/></svg>`,
        ceu: `<svg class="aureola" viewBox="0 0 560 560" fill="none" stroke="#e2b866"><circle cx="280" cy="250" r="240" stroke-opacity=".25"/><circle cx="280" cy="250" r="226" stroke-opacity=".15"/>${Array.from(
          { length: 120 },
          (_, i) => {
            const a = (i * 3 * Math.PI) / 180,
              L = i % 10 ? 232 : 216;
            return `<line x1="${280 + Math.cos(a) * 240}" y1="${250 + Math.sin(a) * 240}" x2="${280 + Math.cos(a) * L}" y2="${250 + Math.sin(a) * L}" stroke-opacity=".35"/>`;
          },
        ).join(
          '',
        )}<ellipse cx="280" cy="250" rx="260" ry="90" stroke-opacity=".2" stroke-dasharray="3 5" transform="rotate(-20 280 250)"/></svg>`,
        aurora: `<svg class="aureola" viewBox="0 0 560 560"><defs><radialGradient id="au"><stop offset="0" stop-color="#6ff0c4" stop-opacity=".3"/><stop offset=".6" stop-color="#6ff0c4" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><linearGradient id="ag" x1="0" x2="1"><stop offset="0" stop-color="#6ff0c4"/><stop offset="1" stop-color="#ff8fc8"/></linearGradient></defs><circle cx="280" cy="250" r="280" fill="url(#au)"/><path d="M60 250A220 220 0 0 1 500 250" fill="none" stroke="url(#ag)" stroke-opacity=".45" stroke-width="2"/></svg>`,
      }[D];

      // ---------- telas ----------
      const telas = {
        inicio: () => `${lateral('inicio')}<main>
    <div class="limiar">
      <div class="fala"><div class="selo-g">${selo('g')}</div><div class="cap">${frase[0]}</div><h1>${frase[1]}</h1><p class="sub">${frase[2]}</p></div>
      <div class="estrela-forte" style="--halo:#d77a9a">${aureola}${capa(obras[0], 24)}
        <div class="info"><b>Dom Casmurro</b><span>Machado de Assis · cap. LXII de CXLVIII</span></div>
        <div class="prog"><i style="width:62%"></i></div>
        <a class="botao">${I('livro')} Continuar lendo</a></div>
    </div>
    <div class="mundos-rodape"><span class="rot">Seus mundos</span>${mundos.map((m) => `<span class="mundo" style="--m:${m[1]}"><i></i>${m[0]} <small>${m[2]}</small></span>`).join('')}</div>
  </main>`,
        biblioteca: () => `${lateral('bib')}<main>
    <div class="topo">${busca}<span class="esp"></span><span class="migalha">Grade · Lista</span></div>
    <div class="bib"><h2>Biblioteca <small>385 obras em 6 mundos</small></h2>
      <div class="linha"><span class="chip on" style="--m:#ece8f6">Todos os mundos</span>${mundos.map((m) => `<span class="chip" style="--m:${m[1]}"><i></i>${m[0]}</span>`).join('')}<span class="esp"></span><span class="migalha">Lidas por último ▾</span></div>
      <div class="grade">${obras.map((o, i) => `<div class="obra ${i === 1 ? 'foco' : ''}" style="--halo:${o[6]}">${capa(o, 14)}<div class="reflexo"></div><div class="nome">${o[0]}</div><div class="autor">${o[1]}</div>${o[5] ? `<div class="prog"><i style="width:${o[5]}%"></i></div>` : ''}</div>`).join('')}</div>
    </div></main>`,
        leitor: () => `<main style="grid-column:1/-1">
    <div class="leitor"><div class="barra">${I('voltar')}<b>Dom Casmurro</b><span>· Machado de Assis</span><span class="esp"></span>${I('aa')}${I('marca')}${I('busca')}</div>
      <div class="pagina"><div class="cap-ler">Capítulo XXXII</div><h3>Olhos de ressaca</h3>
        <p>Tudo era matéria às curiosidades de Capitu. Caso houve, porém, no qual não sei se aprendeu ou ensinou, ou se fez ambas as coisas, como eu. É o que contarei no outro capítulo. Neste direi somente que, passados alguns dias do ajuste com o agregado, fui ver a minha amiga.</p>
        <p>Era tarde; o sol ia já descendo. Capitu deixou-se fitar e examinar. Só me perguntava o que era, se nunca os vira; eu nada achei extraordinário; a cor e a doçura eram minhas conhecidas. A demora da contemplação creio que lhe deu outra ideia do meu intento.</p>
        <p><mark>Olhos de cigana oblíqua e dissimulada.</mark> Eu não sabia o que era oblíqua, mas dissimulada sabia, e queria saber se podiam ser chamados assim. Capitu deixou-se fitar e examinar, mas eu sentia que eles me fitavam também, e com uma força que me arrastava para dentro.</p>
        <p>Traziam não sei que fluido misterioso e enérgico, uma força que arrastava para dentro, como a vaga que se retira da praia, nos dias de ressaca.</p>
      </div></div>
    <div class="lado-notas"><div class="nota"><b>Sua nota</b>Primeira vez que o Bento olha de verdade. Ligar com o cap. CXXIII.</div><div class="nota"><b>Ligação</b>Olhos de ressaca → <i>Memórias Póstumas</i>, cap. VII</div></div>
    <div class="orbita-prog"><svg viewBox="0 0 96 96" fill="none"><circle cx="48" cy="48" r="44" stroke="currentColor" stroke-opacity=".12" stroke-width="2" style="color:var(--tx)"/><path d="M48 4A44 44 0 1 1 9.5 69" stroke="var(--luz)" stroke-width="2.5" stroke-linecap="round"/><circle cx="9.5" cy="69" r="4" fill="var(--luz)"/></svg><span><b>62%</b>9 min no cap.</span></div>
  </main>`,
      };
      const app = document.getElementById('app');
      if (T === 'leitor') app.style.gridTemplateColumns = '1fr';
      app.innerHTML = telas[T]();
      document.body.insertAdjacentHTML('beforeend', `<div class="etiqueta">${nomes[D]}</div>`);
    </script>
  </body>
</html>

name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  interface:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formato, lint (camadas e fronteiras), tipos e testes
        run: pnpm check
      - name: Testes de fluxo (Playwright, só no Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @fierium/app exec playwright install --with-deps chromium
          pnpm e2e

  nucleo-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Bibliotecas do Tauri no Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Rust (versão do rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Interface (o executável embute o build)
        run: pnpm build
      - name: Rust (formato, clippy, testes)
        run: pnpm check:rust

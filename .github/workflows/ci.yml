name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formato, lint, tipos e testes
        run: pnpm check
      - name: Testes de fluxo (Playwright, só no Linux)
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @fierium/app exec playwright install --with-deps chromium
          pnpm e2e

name: Lançamento
# Cria um RASCUNHO de Release no GitHub com os instaladores e o latest.json do atualizador.
# Dispara numa tag v* (ex.: v0.5.0) ou à mão (Actions → Lançamento → Run workflow).
# Segredos (Settings → Secrets and variables → Actions): TAURI_SIGNING_PRIVATE_KEY e
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD. Veja ferramentas/chave-atualizacao.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pacotes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pacotes: nsis,msi
          - os: ubuntu-22.04 # glibc mais antiga: roda em mais distros (inclusive Fedora novo)
            pacotes: appimage,deb,rpm
          # macOS (opcional, desligado: sem certificado da Apple o sistema bloqueia o app)
          # - os: macos-latest
          #   pacotes: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Bibliotecas do Tauri no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev rpm
      - name: Rust (versão do rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Fierium v__VERSION__'
          releaseBody: 'Notas no CHANGELOG.md. Como instalar: docs/INSTALAR.md. No Windows, baixe o arquivo .exe.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles ${{ matrix.pacotes }}
